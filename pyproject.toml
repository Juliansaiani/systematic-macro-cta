[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-macro-cta"
version = "0.1.0"
description = "Systematic multi-asset macro CTA trend following with volatility targeting and convex crisis alpha"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.8", "yfinance>=0.2.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6"]

[project.scripts]
cta-study = "macro_cta.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
